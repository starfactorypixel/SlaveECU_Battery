; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = ststm32
board = genericSTM32F103C8
board_build.stm32cube.custom_config_header = yes
framework = stm32cube
lib_deps = 
	https://github.com/starfactorypixel/PixelConstantsLibrary.git
	https://github.com/starfactorypixel/Library_CUtils.git
	https://github.com/starfactorypixel/PixelCANLibrary.git#version-0.2.0
	https://github.com/starfactorypixel/Library_PixelLed.git
	https://github.com/starfactorypixel/PixelLoggerLibrary.git
	https://github.com/starfactorypixel/Library_DrakePin.git
	https://github.com/starfactorypixel/Library_PixelSPI.git
	https://github.com/starfactorypixel/Library_PixelAnalogMux.git
	https://github.com/starfactorypixel/Library_PixelOneWire.git
debug_tool = stlink
monitor_speed = 500000
monitor_port = COM3

[env:Debug]
build_type = debug
build_unflags = 
build_flags = 
	-D DEBUG

[env:Release]
build_type = release
build_unflags = 
build_flags = 
